[project]
name = "telegram-data-platform"
version = "0.1.0"
description = "Telegram data platform: collection (snscrape), Bronze/Silver/Gold (DuckDB), ML enrichment, Airflow"
requires-python = ">=3.11,<3.12"
dependencies = [
    # Core storage
    "duckdb==1.5.6",
    "pyarrow>=16.0.0",
    # Telegram collection via public web interface (no API key required).
    # PyPI release of snscrape is stale; Telegram module is maintained on master.
    "snscrape @ git+https://github.com/JustAnotherArchivist/snscrape@master",
    "requests>=2.32.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.2.0",
    # Utils
    "tenacity>=8.3.0",
    "python-dotenv>=1.0.1",
    "polars>=2.0.0",
    "numpy>=2",
    "torch>=2.2,<2.6",
    "transformers>=4.44,<5",
    "great-expectations>=1.3,<2",
    "marshmallow<4",
    "cryptography<44",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[tool.uv]
# Locked environment is used inside the Airflow image and for local dev.
package = false

[tool.pytest.ini_options]
markers = ["slow: model smoke tests (download models on first run)"]
addopts = "-m 'not slow'"
# собираем только tests/: в dags/ лежат DAG-и с import airflow,
# которого нет в тестовом окружении
testpaths = ["tests"]
